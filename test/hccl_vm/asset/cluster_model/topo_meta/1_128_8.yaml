# 1 pod × 128 server/pod × 8 rank/server = 1024 rank
meta:
  podNum: 1
  serNum: 128
  rankNum: 1024

topology:
  - podId: 0
    servers:
      - serId_range: [0, 127]
        ranks_range: [0, 7]
