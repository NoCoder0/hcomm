name: "ascend950_cluster_80_sp_1280_server_normal"
description: "昇腾950 normal万卡集群：80个超级节点，每个超级节点16个服务器"

# 超节点总数量
super_node_num: 80
# sever/pod总数量: 80 * 16
server_num: 1280
server_list:
  # 0-15 server: 均采用ascend950_server_topo_normal拓扑类型
  - {super_pod_id_range: [0, 79], id_range: [0, 15], soc_version: "Ascend950DT_95A1", server_topo: "ascend950_server_topo_normal.yaml"}
