type: "server_intra_links"
name: "ascend950_links_topo_biaoka"
description: "ascend950芯片标卡机型拓扑连接关系描述文件"

soc_version: "Ascend950"
device_num: 16
hardware_type: "950D-biaoka-16P-topo"

device_ports_allocate_map:
 # port分配表: 0: 不使用, 1: device直连, 2: device连交换机, 3: d2h端口
 #                 portId:  0  1  2  3  4  5  6  7  8
    - {die_id: 0, pin_map: [0, 0, 0, 0, 1, 1, 1, 0, 0]} # die0
    - {die_id: 1, pin_map: [0, 0, 0, 0, 0, 0, 0, 0, 0]} # die1

links:
  - link_mode: "fullmesh"
    connections:
      - {die_id: 0, topo_instance_id: 0, devices_range: [0, 3]}
      - {die_id: 0, topo_instance_id: 1, devices_range: [4, 7]}
      - {die_id: 0, topo_instance_id: 2, devices_range: [8, 11]}
      - {die_id: 0, topo_instance_id: 3, devices_range: [12, 15]}
